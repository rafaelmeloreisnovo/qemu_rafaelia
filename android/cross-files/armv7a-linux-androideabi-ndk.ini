# Meson cross-file: armeabi-v7a Android (NDK r27c)
# ARM32 / armeabi-v7a: minimum API 19, NEON assumed present.
#
# See aarch64-linux-android-ndk.ini for usage notes.

[constants]
ndk_root      = '/opt/android-ndk'
api_level     = '19'
target_triple  = 'armv7a-linux-androideabi' + api_level
toolchain     = ndk_root + '/toolchains/llvm/prebuilt/linux-x86_64'

[binaries]
c       = toolchain + '/bin/' + target_triple + '-clang'
cpp     = toolchain + '/bin/' + target_triple + '-clang++'
ar      = toolchain + '/bin/llvm-ar'
strip   = toolchain + '/bin/llvm-strip'
ranlib  = toolchain + '/bin/llvm-ranlib'
pkgconfig = 'pkg-config'

[built-in options]
c_args   = ['-fPIC', '-mfpu=neon', '-mfloat-abi=softfp', '-DANDROID',
            '-D__ANDROID_API__=' + api_level]
cpp_args = ['-fPIC', '-mfpu=neon', '-mfloat-abi=softfp', '-DANDROID',
            '-D__ANDROID_API__=' + api_level]

[host_machine]
system     = 'android'
cpu_family = 'arm'
cpu        = 'cortex-a7'
endian     = 'little'
