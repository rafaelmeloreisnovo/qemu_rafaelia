# Meson cross-file: aarch64-linux-android (NDK r27c)
# Usage: ./configure --cross-file android/cross-files/aarch64-linux-android-ndk.ini
#
# Prerequisites:
#   NDK_ROOT must point to the extracted NDK (e.g. ~/android-ndk-r27c)
#   API_LEVEL: minimum API 21 (Android 5.0), arm64 supported from API 21
#
# The QEMU configure script expands ${NDK_ROOT} at ./configure time,
# but Meson ini files do not support shell variable expansion.  Set the
# NDK_ROOT environment variable before invoking ./configure; then pass
# this file directly.  Alternatively substitute the literal path below.

[constants]
# Overridden at ./configure time by the CI job via --cross-file patching
# or by exporting NDK_ROOT before running configure.
ndk_root     = '/opt/android-ndk'
api_level    = '21'
target_triple = 'aarch64-linux-android' + api_level
toolchain    = ndk_root + '/toolchains/llvm/prebuilt/linux-x86_64'

[binaries]
c       = toolchain + '/bin/' + target_triple + '-clang'
cpp     = toolchain + '/bin/' + target_triple + '-clang++'
ar      = toolchain + '/bin/llvm-ar'
strip   = toolchain + '/bin/llvm-strip'
ranlib  = toolchain + '/bin/llvm-ranlib'
pkgconfig = 'pkg-config'

[built-in options]
c_args   = ['-fPIC', '-DANDROID', '-D__ANDROID_API__=' + api_level]
cpp_args = ['-fPIC', '-DANDROID', '-D__ANDROID_API__=' + api_level]

[host_machine]
system     = 'android'
cpu_family = 'aarch64'
cpu        = 'cortex-a53'
endian     = 'little'
