name: RAFCODE QEMU freestanding scoped gates
on:
  pull_request:
    paths:
      - 'rafcode/qemu_fs_v1/**'
      - '.github/workflows/rafcode-qemu-fs-v1.yml'
  workflow_dispatch:
jobs:
  scoped-freestanding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: GCC/Clang native deterministic tests and undefined-symbol gate
        run: |
          CC=gcc sh rafcode/qemu_fs_v1/run-local.sh
          CC=clang sh rafcode/qemu_fs_v1/run-local.sh
      - name: Four-target static-link-only ELF inspection
        shell: bash
        run: |
          set -euo pipefail
          cd rafcode/qemu_fs_v1
          for target in armv7a-linux-gnueabi aarch64-linux-gnu i386-linux-gnu x86_64-linux-gnu; do
            clang --target="$target" -O2 -std=c11 -ffreestanding -fno-builtin               -fno-stack-protector -nostdinc -fuse-ld=lld -nostdlib -static               -Wl,--no-undefined -Wl,-e,raf_fs_move raf_fs.c -o "/tmp/raf-$target.elf"
            test -z "$(nm -u "/tmp/raf-$target.elf")"
            ! readelf -l "/tmp/raf-$target.elf" | grep -q INTERP
            echo "PASS LINK_ONLY $target NO_INTERP NO_UNDEFINED"
          done
