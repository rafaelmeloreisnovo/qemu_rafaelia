name: RAFCODE QEMU A32 v3 scoped tests
on:
  pull_request:
    paths:
      - 'rafcode/qemu_a32_v3/**'
      - '001_PONTEIRO/QEMU_A32_V3.md'
      - '.github/workflows/rafcode-qemu-a32-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-a32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Host GCC and Clang differential contract tests
        run: |
          CC=gcc sh rafcode/qemu_a32_v3/run-local.sh
          CC=clang sh rafcode/qemu_a32_v3/run-local.sh
      - name: Freestanding static link only four ABIs
        shell: bash
        run: |
          set -euo pipefail
          cd rafcode/qemu_a32_v3
          for target in armv7a-linux-gnueabi aarch64-linux-gnu i386-linux-gnu x86_64-linux-gnu; do
            clang --target="$target" -std=c11 -O2 -ffreestanding -fno-builtin -fno-stack-protector -nostdinc -nostdlib -static -fuse-ld=lld -Wl,--no-undefined -Wl,-e,r_run raf_cpu.c raf_mmu.c raf_irq.c raf_decode.c raf_block.c raf_exec.c raf_run.c ../qemu_guest_v2/raf_guest.c -o "/tmp/raf-a32-$target.elf"
            test -z "$(nm -u "/tmp/raf-a32-$target.elf")"
            ! readelf -l "/tmp/raf-a32-$target.elf" | grep -q INTERP
            echo "PASS LINK_ONLY $target"
          done
